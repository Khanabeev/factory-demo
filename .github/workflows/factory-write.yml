name: factory-write

# Write adapter: the ONLY path by which the factory mutates issues.
#
# Using the Actions token makes every write attributable to github-actions[bot]
# (type Bot), which is distinct from the human operator (type User). That
# distinction is what makes gate provenance real — an approval must be provably
# the human's, not the agent's. See docs/adr/0008.
#
# The `marker` input is appended as an HTML comment so a retried dispatch is
# recognisable in the timeline rather than duplicated blindly.

on:
  workflow_dispatch:
    inputs:
      issue:
        required: true
      action:
        description: 'comment | label | unlabel | close | reopen'
        required: true
      value:
        description: label name, or comment body
        required: false
      marker:
        description: idempotency marker recorded in the comment
        required: false

permissions:
  issues: write
  pull-requests: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - name: Apply the requested mutation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          R="${{ github.repository }}"
          I="${{ inputs.issue }}"
          A="${{ inputs.action }}"
          V="${{ inputs.value }}"
          M="${{ inputs.marker }}"

          case "$A" in
            comment)
              body="$V"
              if [ -n "$M" ]; then body="$V"$'\n\n'"<!-- factory:marker=$M -->"; fi
              gh api --method POST "repos/$R/issues/$I/comments" -f body="$body"
              ;;
            label)
              gh api --method POST "repos/$R/issues/$I/labels" -f labels[]="$V"
              ;;
            unlabel)
              gh api --method DELETE "repos/$R/issues/$I/labels/$V"
              ;;
            close)
              gh api --method PATCH "repos/$R/issues/$I" -f state=closed
              ;;
            reopen)
              gh api --method PATCH "repos/$R/issues/$I" -f state=open
              ;;
            *)
              echo "unknown action: $A" >&2
              exit 1
              ;;
          esac
