name: botprobe
on:
  workflow_dispatch:
    inputs:
      issue:
        required: true
permissions:
  issues: write
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          R="${{ github.repository }}"
          I="${{ inputs.issue }}"
          gh api --method POST "repos/$R/issues/$I/labels" -f labels[]='ready-for-human'
          echo "labeled ok"
          gh api --method PATCH "repos/$R/issues/$I" -f state=closed
          echo "closed ok"
          gh api --method PATCH "repos/$R/issues/$I" -f state=open
          echo "reopened ok"
