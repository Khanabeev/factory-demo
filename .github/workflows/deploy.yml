name: deploy

# The factory triggers this workflow when merged work carries the deploy label.
# GitHub runs it; the factory only triggers and polls the run.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number that triggered this deploy
        required: false
      sha:
        description: Commit SHA to deploy
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
